<div class="register-container">
  <div class="register-card">
    <div class="logo-section">
      <img src="assets/vestra-logo.svg" alt="Vestria" class="app-logo">
    <span class="app-name">Vestria</span>
    </div>
    <h1 class="register-title">Criar Conta</h1>
    <p class="register-subtitle">Preencha os dados para se cadastrar</p>
    
    <!-- Mensagens de erro e sucesso -->
    <div class="message-container">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>
    </div>
    
    <form class="register-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input 
          type="text" 
          id="name" 
          name="name"
          [(ngModel)]="name"
          placeholder="Seu nome completo"
          [disabled]="isLoading"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          [disabled]="isLoading"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          [disabled]="isLoading"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="••••••••"
          [disabled]="isLoading"
          required
        >
      </div>
      
      <button type="submit" class="register-button" [disabled]="isLoading">
        <span *ngIf="!isLoading">Criar Conta</span>
        <span *ngIf="isLoading" class="loading-spinner">Criando...</span>
      </button>
      
      <div class="divider">
        <span>OU CONTINUE COM</span>
      </div>
      
      <div class="social-buttons">
        <button type="button" class="social-button google-button" (click)="onGoogleRegister()" [disabled]="isLoading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
      </div>
      
      <div class="login-link">
        <span>Já tem uma conta? </span>
        <a href="#" class="login-text" (click)="goToLogin(); $event.preventDefault()">
          Faça login
        </a>
      </div>
    </form>
  </div>
</div>
