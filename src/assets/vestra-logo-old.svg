<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vestria logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b1220" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Stylized golden V with node circles -->
  <g stroke="#d4af37" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Path approximating the curved V shape -->
    <path d="M22 28 C 32 36, 38 42, 43 52 C 46 58, 48 63, 50 68 C 52 63, 55 56, 59 49 C 65 38, 72 32, 84 28"/>
    <!-- Node circles along the stroke -->
    <circle cx="22" cy="28" r="4" fill="#d4af37"/>
    <circle cx="43" cy="52" r="4" fill="#d4af37"/>
    <circle cx="50" cy="68" r="4" fill="#d4af37"/>
    <circle cx="84" cy="28" r="4" fill="#d4af37"/>
  </g>
</svg>